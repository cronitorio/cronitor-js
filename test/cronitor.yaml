jobs:
    replenishment-report:
        schedule: '0 * * * *'
    data-warehouse-exports:
        schedule: '0 0 * * *'
    welcome-email:
        schedule: 'every 10 minutes'

checks:
    cronitor-homepage:
        request:
            url: 'https://cronitor.io'
        assertions:
            - 'response.time < 2s'

heartbeats:
    production-deploy:
        notify:
            alerts:
                - default
            events:
                complete: true

errors:
    billing-error-spikes:
        trigger: spike
        apps:
            - app_0123456789abcdef
        threshold: 25
        window: 5m
        per: fingerprint
        notify:
            - default
